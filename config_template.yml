# {{ index .Help "api" }}
default-api: openai
# {{ index .Help "model" }}
default-model: gpt-5.5
# {{ index .Help "format-text" }}
format-text:
  markdown: '{{ index .Config.FormatText "markdown" }}'
  json: '{{ index .Config.FormatText "json" }}'
# {{ index .Help "mcp-servers" }}
mcp-servers:
  # Example: GitHub MCP via Docker:
  # github:
  #   command: docker
  #   env:
  #     - GITHUB_PERSONAL_ACCESS_TOKEN=xxxyyy
  #   args:
  #     - run
  #     - "-i"
  #     - "--rm"
  #     - "-e"
  #     - GITHUB_PERSONAL_ACCESS_TOKEN
  #     - "ghcr.io/github/github-mcp-server"
# {{ index .Help "mcp-timeout" }}
mcp-timeout: 15s
# {{ index .Help "max-tool-calls" }}
# Recommended when using local MCP servers for agentic workflows (e.g. max-tool-calls: 50).
# max-tool-calls: 0
# {{ index .Help "roles" }}
roles:
  "default": []
  # Example, a role called `shell`:
  # shell:
  #   - you are a shell expert
  #   - you do not explain anything
  #   - you simply output one liners to solve the problems you're asked
  #   - you do not provide any explanation whatsoever, ONLY the command
# {{ index .Help "format" }}
format: false
# {{ index .Help "json-schema" }}
# json-schema: /path/to/schema.json
# {{ index .Help "json-schema-retries" }}
json-schema-retries: 2
# {{ index .Help "role" }}
role: "default"
# {{ index .Help "raw" }}
raw: false
# {{ index .Help "quiet" }}
quiet: false
# {{ index .Help "temp" }}
temp: 1.0
# {{ index .Help "topp" }}
topp: 1.0
# {{ index .Help "topk" }}
topk: 50
# {{ index .Help "no-limit" }}
no-limit: false
# {{ index .Help "word-wrap" }}
word-wrap: 80
# {{ index .Help "prompt-args" }}
include-prompt-args: false
# {{ index .Help "prompt" }}
include-prompt: 0
# {{ index .Help "max-retries" }}
max-retries: 5
# {{ index .Help "fanciness" }}
fanciness: 10
# {{ index .Help "status-text" }}
status-text: Generating
# {{ index .Help "theme" }}
theme: charm
# {{ index .Help "max-input-chars" }}
max-input-chars: 12250
# {{ index .Help "max-tokens" }}
# max-tokens: 100
# {{ index .Help "max-completion-tokens" }}
max-completion-tokens: 100
# {{ index .Help "apis" }}
# API key priority (highest to lowest):
#   1. api-key-cmd  — stdout of a shell command; recommended (keys never touch disk)
#                     e.g. api-key-cmd: op read "op://vault/openai/key"
#                          api-key-cmd: rbw get -f OPENAI_API_KEY chat.openai.com
#                          api-key-cmd: security find-generic-password -s OPENAI-API -w
#                     Note: the command must write only the key to stdout. If it
#                     fails, henji errors out rather than falling back to a
#                     lower-priority source below.
#   2. api-key-env  — read from a named environment variable
#   3. api-key      — plaintext in this file; stored at 0600 but avoid committing
#                     to version control. Use only when the above options are unavailable.
#   4. default env  — provider-specific default (e.g. OPENAI_API_KEY)
apis:
  openrouter:
    # A single OpenAI-compatible endpoint that proxies many providers/models
    # (https://openrouter.ai/models) under one API key, useful for trying
    # several current models without configuring each provider separately.
    base-url: https://openrouter.ai/api/v1
    api-key:
    api-key-env: OPENROUTER_API_KEY
    # api-key-cmd: security find-generic-password -s OPENROUTER-API -w
    models: # https://openrouter.ai/models
      # max-completion-tokens overridden per-model: the global
      # max-completion-tokens setting above gets consumed by these reasoning
      # models' hidden "thinking" tokens before any visible content is
      # emitted, leaving an empty response otherwise.
      z-ai/glm-5.2:
        aliases: ["glm", "glm-5.2"]
        max-input-chars: 4194304 # context_length 1048576 * 4
        max-completion-tokens: 4096
      deepseek/deepseek-v4-flash:
        aliases: ["deepseek", "deepseek-v4"]
        max-input-chars: 4194304
        max-completion-tokens: 4096
      qwen/qwen3.7-max:
        aliases: ["qwen", "qwen-max"]
        max-input-chars: 4000000
        max-completion-tokens: 4096
      "~moonshotai/kimi-latest":
        aliases: ["kimi"]
        max-input-chars: 1048576
        max-completion-tokens: 4096
      perplexity/sonar:
        aliases: ["perplexity"]
        max-input-chars: 4000000
        max-completion-tokens: 4096
  openai:
    base-url: https://api.openai.com/v1
    api-key:
    api-key-env: OPENAI_API_KEY
    # api-key-cmd: security find-generic-password -s OPENAI-API -w
    models: # https://platform.openai.com/docs/models
      gpt-5.5:
        aliases: ["5.5", "gpt5.5"]
        max-input-chars: 794000
        # Reasoning model: without this, the global max-completion-tokens
        # setting gets consumed by hidden thinking tokens and the response
        # comes back empty (same issue as the openrouter models above).
        max-completion-tokens: 4096
  anthropic:
    base-url: https://api.anthropic.com/v1
    api-key:
    api-key-env: ANTHROPIC_API_KEY
    # api-key-cmd: security find-generic-password -s ANTHROPIC-API -w
    models: # https://docs.anthropic.com/en/docs/about-claude/models
      # Latest generation only, verified against /v1/models on 2026-07-01.
      # max-input-chars = max_input_tokens * 4 (same ratio as the google
      # section). Older pinned snapshots (claude-sonnet-4-20250514,
      # claude-3-7-sonnet-*, claude-3-5-haiku-20241022) are no longer in
      # the API's model list and were removed.
      claude-sonnet-5:
        aliases: ["sonnet-5", "sonnet"]
        max-input-chars: 4000000
      claude-opus-4-8:
        aliases: ["opus-4.8", "opus"]
        max-input-chars: 4000000
      claude-fable-5:
        # Generally available as of 2026-07-04.
        aliases: ["fable-5", "fable"]
        max-input-chars: 4000000
        fallback: claude-opus-4-8
      claude-haiku-4-5-20251001:
        # No unversioned "haiku-latest" id yet; update this snapshot id when
        # Anthropic ships the next Haiku generation.
        aliases: ["haiku-4.5", "haiku"]
        max-input-chars: 800000
  google:
    api-key:
    api-key-env: GOOGLE_API_KEY
    # api-key-cmd: security find-generic-password -s GEMINI-API -w
    models: # https://ai.google.dev/gemini-api/docs/models/gemini
      # These "-latest" names are floating aliases Google repoints to newer
      # snapshots over time (verified via the API's modelVersion response
      # field on 2026-07-01: gemini-flash-latest -> gemini-3.5-flash,
      # gemini-flash-lite-latest -> gemini-3.1-flash-lite,
      # gemini-pro-latest -> gemini-3.1-pro-preview). Pinned snapshot names
      # get discontinued by Google over time (this is why the previous
      # gemini-1.5-*-latest entries here started 404ing), so tracking the
      # aliases avoids needing to update this file every time.
      gemini-pro-latest:
        aliases: ["gmp", "gemini", "gemini-pro"]
        max-input-chars: 4194304
      gemini-flash-latest:
        aliases: ["gmf", "flash", "gemini-flash"]
        max-input-chars: 4194304
      gemini-flash-lite-latest:
        aliases: ["gmfl", "flash-lite", "gemini-flash-lite"]
        max-input-chars: 4194304
  localai:
    # Any local OpenAI-compatible gateway (Ollama, mlx-lm, LM Studio,
    # llama.cpp's server, LocalAI, ...) works here, not just LocalAI itself
    # -- point base-url at whatever you're running. Local servers don't
    # check the key, but henji's OpenAI-compatible request path always
    # sends one, so api-key is set to a placeholder value.
    base-url: http://localhost:8080/v1
    api-key: local
    models:
      mlx-community/gemma-4-E2B-it-qat-4bit:
        aliases: ["local", "gemma"]
        max-input-chars: 50000
