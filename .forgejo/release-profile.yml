version: 2

runner_label: ubuntu-latest

actions:
  checkout: actions/checkout@v4
  setup_go: actions/setup-go@v5
  release: actions/forgejo-release@v2

release:
  uploader_kind: forgejo-release-v2-public
  url_expression: ${{ forgejo.server_url }}
  repository_expression: ${{ forgejo.repository }}
  token_expression: ${{ forgejo.token }}
  tag_expression: ${{ forgejo.ref_name }}
  notes_expression: ${{ format('Release {0}', forgejo.ref_name) }}

build:
  product: henji
  package: .
  cgo_enabled: false
  ldflags: "-s -w -X main.Version=${{ forgejo.ref_name }}"
  targets:
    - linux/amd64
    - linux/arm64
    - darwin/amd64
    - darwin/arm64
    - windows/amd64

quality:
  test_command: go test ./...
  vet_command: go vet ./...
  checksums: true

diagnostics:
  mode: native-actions-logs

pre_release:
  reference_environment: >-
    developer workstation with the Go toolchain from go.mod, a C toolchain so
    go test -race can build (CGO_ENABLED=1), and network access plus a funded
    OPENROUTER_API_KEY for the OpenRouter E2E script
  reference_checks:
    - name: race
      command: go test -race ./...
    - name: openrouter-e2e
      command: ./scripts/e2e-openrouter-test.sh
  evidence_location: docs/release-checkpoints.md
