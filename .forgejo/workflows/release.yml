# Generated from .forgejo/release-profile.yml (version: 2).
# Render every placeholder from a confirmed profile; do not edit by hand.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Portable, non-interactive release-runner gates only. Race, PTY/TTY, and
      # real-gateway checks are pre-tag evidence (see .forgejo/release-profile.yml
      # and docs/release-checkpoints.md).
      - name: Test
        run: |
          set -euo pipefail
          go test ./...

      - name: Vet
        run: |
          set -euo pipefail
          go vet ./...

      - name: Build binaries
        id: build
        env:
          LDFLAGS: -s -w -X main.Version=${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/henji-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/henji-linux-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/henji-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/henji-darwin-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/henji-windows-amd64.exe .
          sha256sum dist/henji-* > dist/SHA256SUMS

      - name: Upload release
        if: success()
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ forgejo.server_url }}
          repo: ${{ forgejo.repository }}
          token: ${{ forgejo.token }}
          tag: ${{ forgejo.ref_name }}
          release-dir: dist
          release-notes: ${{ format('Release {0}', forgejo.ref_name) }}
